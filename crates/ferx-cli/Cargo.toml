[package]
name = "ferx-cli"
version = "0.4.0"
edition = "2021"
description = "Command-line interface for the ferx NLME modeling engine"
license = "MIT"
authors = ["Ron Keizer", "Teun Post", "Hidde van de Beek"]
repository = "https://github.com/FeRx-NLME/ferx-core"
keywords = ["nlme", "pharmacometrics", "pharmacokinetics", "population-pk", "cli"]
categories = ["command-line-utilities", "science", "simulation"]

# The installed binary keeps the name `ferx` — the package rename is invisible
# to users. It lives here rather than in the `ferx-core` package because it will
# grow `ferx-tools` subcommands (bootstrap, SCM), and `ferx-tools` depends on
# `ferx-core`; a binary in `ferx-core` that called into tools would be a cycle.
[[bin]]
name = "ferx"
path = "src/main.rs"

[dependencies]
# `default-features = false` is load-bearing, not tidiness: without it a
# member-scoped or `--workspace` command resolves `ferx-core` to
# `(<requested features>, default)` — a DIFFERENT unit from the root steps'
# `--no-default-features`, so CI recompiles all of `ferx-core` a second time
# instead of linking the rlib it just built, and `--no-default-features` is
# silently defeated for `ferx-core` everywhere (harmless only while
# `default = []`; `survival` is slated to become default-on).
ferx-core = { path = "../..", version = "0.4.0", default-features = false }
ferx-tools = { path = "../ferx-tools", version = "0.4.0" }
indicatif = "0.18.4"
# The binary's global allocator (`src/main.rs`): an estimation allocates many small,
# short-lived buffers per subject per evaluation. A binary-level choice; the `ferx-core`
# library leaves it to its embedder. `v2` pins mimalloc's C line explicitly: the crate
# builds v3 by default, so without it a lock bump could switch the allocator's major
# version with no diff here. v2 was chosen on measurement (#2435): as fast as v3 and
# ~12 MB less resident memory on a 4-thread bootstrap.
mimalloc = { version = "0.1", features = ["v2"] }
# Matches the root package and `ferx-tools`: see the note there — floats must
# reload as themselves, not to within 1 ULP.
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
tempfile = "3"
