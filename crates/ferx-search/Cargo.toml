[package]
name = "ferx-search"
version = "0.4.0"
edition = "2021"
description = "Model-space search on top of ferx-core: structural, variability, residual-error and covariate search"
license = "MIT"
authors = ["Ron Keizer", "Teun Post", "Hidde van de Beek"]
repository = "https://github.com/FeRx-NLME/ferx-core"
keywords = ["nlme", "pharmacometrics", "model-selection", "covariate-search", "amd"]
categories = ["science", "mathematics", "simulation"]
# Held back from crates.io until its license is settled (#3183). `ferx-cli`
# depends on this crate, so it cannot be published either until then.
publish = false

[dependencies]
# `default-features = false` is load-bearing, not tidiness: see the note in
# `crates/ferx-tools/Cargo.toml`.
ferx-core = { path = "../..", version = "0.4.0", default-features = false }
# One item: `lanes::run_in_lanes`, the bounded fit queue. The arrow points this
# way only: `ferx-tools` must never depend on `ferx-search` (#3185, pinned by
# `tests/public_api_boundary.rs`).
ferx-tools = { path = "../ferx-tools", version = "0.4.0" }
csv = "1.3"
nalgebra = "0.35"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` is load-bearing, not tidiness. Without it `serde_json`
# parses floats with a fast algorithm accurate only to within 1 ULP, so a
# journalled criterion or OFV can come back one bit different from the one the
# interrupted run computed — and a resumed run whose whole promise is "the same
# numbers" would report a different score, invisibly, since the CSV prints six
# decimals. Caught by `search_runner_end_to_end`: -200.28784144636055 read back
# as -200.28784144636057.
serde_json = { version = "1", features = ["float_roundtrip"] }
# The `.ferxsearch` search configuration (#1179) is TOML — the space a search
# runs over is configuration, not model, so it lives in its own file rather
# than a `.ferx` block. Only the `search::config` module reads it.
toml = "1"

# `search.lock` staleness only: `kill(pid, 0)` is how a search directory whose
# owner was hard-killed is taken over instead of needing a manual delete —
# resuming after a kill is the case the journal exists for. Already in the
# workspace lockfile (via `tempfile` and `rand`), so this adds no crate to the
# build; non-unix targets compile a `cfg` fallback and never take a lock over.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Heavy convergence tests (5–60 min wall). Default `cargo test` ignores them;
# a nightly/manual job opts in with --features slow-tests.
slow-tests = []

[dev-dependencies]
tempfile = "3"
