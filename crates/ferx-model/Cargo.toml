[package]
name = "ferx-model"
version = "0.4.0"
edition = "2021"

description = "The model and numerics layer of ferx-core: model parser, PK/ODE kernels, sensitivities, likelihoods. Use it through ferx-core, which re-exports it."
license = "MIT"
authors = ["Ron Keizer", "Teun Post", "Hidde van de Beek"]
repository = "https://github.com/FeRx-NLME/ferx-core"
keywords = ["nlme", "pharmacometrics", "pharmacokinetics"]
categories = ["science", "mathematics", "simulation"]
# Published to crates.io because the published `ferx-core` depends on it (#3041). It is not a
# public API of its own: `ferx-core` re-exports the public part and gates it in its baselines.

[lib]
name = "ferx_model"

[features]
default = []
ci = []
nn = []
survival = []
markov = ["survival"]
slow-tests = []
# The test helpers (`types::test_helpers`, `test_models`, …) for ferx-core's own unit tests.
test-support = ["dep:approx"]

[dependencies]
approx = { version = "0.5", optional = true }
nalgebra = "0.35"
csv = "1.3"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: without it `serde_json` parses floats to within 1 ULP
# rather than exactly, so a `.fitrx` bundle — or any JSON a checkpoint or cache
# reads back — can return an estimate one bit from the one that was written.
# Every consumer here is numeric output that is meant to reload as itself.
serde_json = { version = "1", features = ["float_roundtrip"] }
rayon = "1.10"
rand = "0.10"
rand_distr = "0.6"
# Trimmed feature set: the model-text patterns need Unicode `\w`/`\s`/`\b` and `(?i)` case
# folding (the keyword gate in the parser is pinned to agree with them on NBSP, `K`
# (Kelvin), `İ`, ...), but never `\p{..}` classes, scripts or the perf-only engines.
regex = { version = "1.11", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
thiserror = "2"
tempfile = "3"
sha2 = "0.11"
# Native code for the ODE right-hand side (`parser/rhs_jit.rs`). Not a feature: every
# consumer (`ferx-cli`, `ferx-tools`, ferx-r) depends on `ferx-core` with
# `default-features = false`, so a default feature would be off exactly where it matters.
# A host Cranelift cannot target falls back to the register code at runtime.
# No default features: `timing` (pass timers nothing reads) is the one default we can
# drop — `std`/`unwind` are required by cranelift-jit anyway, `host-arch` is the ISA.
cranelift-codegen = { version = "0.137", default-features = false, features = ["std", "host-arch"] }
cranelift-frontend = "0.137"
cranelift-jit = "0.137"
cranelift-module = "0.137"
cranelift-native = "0.137"


[dev-dependencies]

# Parses the whole fit YAML in tests, so a writer that breaks the document fails (#2268).
# serde-saphyr, not serde_yaml: the latter is deprecated and pulls in the
# unmaintained unsafe-libyaml (RUSTSEC-2024-0449, #2411).
serde-saphyr = { version = "2.0", default-features = false, features = ["deserialize"] }

