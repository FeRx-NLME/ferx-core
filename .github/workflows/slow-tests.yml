name: Slow tests

# Heavy fit-based regression tests (each runs a real FOCEI / GN-hybrid / EKF
# population fit). The main CI workflow `#[ignore]`s them via
# `#[cfg_attr(not(feature = "slow-tests"), ignore)]`. This workflow runs them on a
# schedule + on-demand so they can't block pull-request merges but still get
# exercised regularly against `main`.
#
# Layout (#2182). One job per leg outgrew its budget (66 min on a fast runner, killed
# at 100 on a slow one), so the suite is sharded by test binary:
#   - `shards`: 4 jobs `Slow regression tests (<leg> k/4)`, each compiling the
#     workspace and running the binaries `tools/ci-test-shard.py` gives it;
#   - `summary`: `Slow regression tests (<leg>)`, the one verdict over the four
#     shard manifests (every target on exactly one shard, every listed test run);
#   - `nn` + `nn-summary`: the lib unit tests and `tools/slow-nn-tests.txt` with `nn`
#     on, and the check that the list is every binary `nn` adds a test to.
# <leg> is `core` daily and on a push, `full-nn` on the Sunday cron: every binary
# with `nn`, which covers nn-on behaviour in binaries that hold no nn test.

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC: the core shards + the narrowed nn job
    - cron: '0 7 * * 0'   # Sundays 07:00 UTC: the full-nn shards (every binary with nn)
  workflow_dispatch:       # manual trigger
    inputs:
      # Which sharded leg a dispatch runs; `core` also runs the narrowed nn job.
      leg:
        description: 'Sharded leg: core (plus the narrowed nn job) or full-nn (every binary with nn)'
        type: choice
        options: [core, full-nn]
        default: core
      # The one way to get a passing test's eprintln! digits from an x86_64 Linux run --
      # the reference platform for fit numbers (#1688). Off by default: it would flood
      # every nightly log, and push/schedule events have no `inputs`, so they never see it.
      nocapture:
        description: 'Run cargo test with nocapture, printing the eprintln! output of passing tests'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      # One rule, no per-module judgement: re-run when a push to `main` touches the code
      # compiled into this job's test binaries, the data those tests read, or the
      # definition of the job itself.
      #
      # It is deliberately NOT a curated list of "modules that can move a fit". That list
      # existed and it rotted: `src/api.rs` was named here, the file became `src/api/`, and
      # the glob went dead — silently, for months, because a stale glob and a live one look
      # identical in review (#949). Enumerating by module also makes every new module a
      # silent omission until someone remembers; that is how `src/pk`, `src/survival`,
      # `examples/` and `nonmem_anchor/` all ended up uncovered.
      #
      # Measured over the last 400 first-parent commits on `main`: the original 7-entry
      # filter fired on 292, a per-module list on 359, and this one on 363. So curating
      # bought 4 skipped runs in 400 (1% — one of them a `Cargo.lock` bump that should run
      # anyway) while silently missing 67. That is the trade, and it is not close.
      #
      # `tools/**` (#1157). Two reasons, and the first is the substantive one: `tools/`
      # holds inputs the gated fits are tied to — `tools/vi-emvi-comparison/*.ferx` are the
      # harness models the VI/EMVI anchors mirror, and `make-wide-residual-data.sh`
      # generates the dataset `tests/nonmem/warfarin_10pct.ctl` is built from, so editing
      # either can move a nightly anchor with nothing under `src/` or `tests/` changed.
      # Second, `tests/preflight_owns_the_fast_gates.rs` names `tools/preflight.sh` in its
      # assertions, which is enough for the harvest below to derive `tools` as an input
      # root — so the guard test requires this entry either way.
      #
      # Measured before adding it, the same way the numbers above were: over the last 400
      # first-parent commits on `main`, 3 touch `tools/` and **0** would newly fire this
      # workflow — all three also touched `src/` or `tests/`. Read that as an upper bound on
      # what it cost *then*, not as a forecast: #1157 makes `tools/preflight.sh` the place
      # new gates are added, so tools-only commits should get MORE common, not less. The
      # measurement says the entry was free to add; the reasons above are why it stays.
      #
      # `tests/slow_test_path_filter.rs` pins this list in both directions: every input the
      # suite reads must be matched here, and every entry here must match a tracked file.
      # The input roots it checks against are derived from the tree and from the fixture
      # paths the tests themselves open — so a new module or fixture directory fails that
      # test until it is added below, rather than going quietly uncovered.
      - '.github/workflows/slow-tests.yml'  # the feature set / cargo command this job runs
      - 'Cargo.lock'                        # a nlopt/nalgebra/rand bump moves fit numbers and RNG streams
      - 'Cargo.toml'                        # the `ci-test` profile + the `slow-tests` / `survival` features
      - 'crates/**'                         # the workspace members — the job runs `--workspace`
      - '!crates/docs-lint/**'              # ...except the one the command --excludes; see the run: step
      - 'data/**'                           # fixture CSVs the fits read by literal path
      - 'examples/**'                       # `.ferx` models the anchors load (e.g. the adaptive vanco suite)
      - 'nonmem_anchor/**'                  # committed NONMEM control streams, data and `.phi` references
      - 'src/**'                            # everything linked into the fits
      - 'tests/**'                          # the gated fits themselves + the shared tests/common harness
      - 'tools/**'                          # scripts CI itself executes (preflight, the API baseline)

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: nightly
  RAYON_NUM_THREADS: 1

jobs:
  # Shard k of 4 of the leg. The leg is one computed matrix value: `full-nn` on the
  # Sunday cron or a dispatch asking for it, `core` otherwise. A run therefore has
  # exactly one sharded leg, so `needs.shards.result` below is that leg's alone.
  #
  # Budgets come from measurement, not from a model. LPT balances the four core shards
  # to ~18 test-min each, so no shard is the "lib shard"; what varies is the runner.
  # Over 12 core shard runs on the #2182 dispatches the worst shard took 35.5 min
  # (39451120193, shard 2: compile 8.9 min, tests 26.6 min — a slow draw, running
  # ~1.7x its weights). Put that slowest test run behind a worst-case compile, a cold
  # cache on a slow machine (21 min for the whole workspace on `fcad163d`, ~15.5 for
  # a shard's share of it per the plan's M8), and a shard takes 42 min: 70% of a
  # 60-min inner budget. The full-nn budget (95) is the same construction with nn's
  # extra lib tests on one shard, and stays unmeasured until a full-nn run lands.
  # Each job ceiling adds 15 min for checkout, toolchain and cache restore. `summary`
  # warns when a shard passes 70% of its budget, so the next rebalance arrives as a
  # warning, not as a red night.
  shards:
    name: Slow regression tests (${{ matrix.leg }} ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.leg == 'core' && 75 || 110 }}
    strategy:
      # A failing shard must NOT cancel the others: every shard reports, like
      # `--no-fail-fast` within one.
      fail-fast: false
      matrix:
        leg: ["${{ github.event.schedule == '0 7 * * 0' && 'full-nn' || inputs.leg || 'core' }}"]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal

      - name: Drop the runner image's stable toolchain from the cache key (#2184)
        # rust-cache hashes EVERY installed toolchain into its key (`rustup toolchain
        # list`), including the stable the runner image ships. While a new image rolls out,
        # two runners with the same nightly get different keys: on `fcad163d` the core leg
        # (image 20261018.339, stable 1.99.1) missed under `897d571a` while the nn leg
        # (20261012.334, stable 1.99.0) hit `f7f40fb1`. Nothing here uses stable —
        # `RUSTUP_TOOLCHAIN: nightly` is set workflow-wide — so the toolchain part of the
        # key now follows the nightly alone (Cargo.lock, the manifests and the job still
        # count). `rustup default nightly` first, so the default never names a removed
        # toolchain; the uninstall exits 0 when an image ships no stable at all.
        run: |
          rustup default nightly
          rustup toolchain uninstall stable

      - uses: Swatinem/rust-cache@v2
        with:
          # One key for the four shards of a leg, not one per shard: the cache holds
          # dependencies only, identical on every shard, so the first save wins, and a
          # per-shard key would only quadruple the misses (#2182).
          shared-key: ${{ matrix.leg == 'core' && 'ci-slow' || 'ci-slow-nn' }}
          # Save even when the job is red (#2184). A timed-out run otherwise leaves the
          # next same-key run cold. What is saved is dependencies only: rust-cache removes
          # the workspace crates from `target/` before saving (`cache-workspace-crates`
          # defaults to false). Cargo writes a dependency's fingerprint only after it built,
          # so a cache saved mid-build is never trusted wrongly — it is INCOMPLETE.
          #
          # Accepted cost: the save also runs on a CANCELLED job (rust-cache's post step is
          # `success() || CACHE_ON_FAILURE`). A run cancelled during the ~30 s dependency
          # compile of a miss saves part of `deps/`; later runs are exact hits, which
          # rust-cache never re-saves, so each rebuilds the missing crates (≤ ~26 s) until
          # the next nightly rolls the key — within a day. `save-if` cannot tell a cancel
          # apart (it is read at job start), and a cold miss on every red run costs more.
          #
          # Measured over 70 jobs (35 runs on main, 2026-10-17..20), this is a small win,
          # not the 6 min #2184 first suspected. 19 jobs missed: 10 races (an earlier
          # same-key run was still going), 8 new keys (6 nightly, 2 runner image — the
          # step above), 1 after red runs that saved nothing (this setting). A miss costs
          # ~26 s of dependency builds (median; hits 16.6 vs misses 17.4 min mean); the
          # 11–15 vs 17–20 min compile split is the runner draw, not the cache.
          cache-on-failure: true

      - name: Does this shard run the canakinumab anchor?
        id: plan
        # The planner is the step's own command (no `$(…)`), so a planner error fails
        # the step instead of reading as "no".
        run: python3 tools/ci-test-shard.py has-target slow ${{ matrix.shard }} ${{ strategy.job-total }} --lib-parts 1 mbma_canakinumab_case_study >> "$GITHUB_OUTPUT"

      - name: Fetch the canakinumab MBMA data (#1913)
        # `tests/mbma_canakinumab_case_study.rs` anchors the bounded-endpoint MBMA path on
        # data whose licence (CC BY-NC-ND) forbids committing them, so the file is
        # downloaded from Europe PMC here and verified against the sha256 pinned in the
        # script. It lands in the git-ignored `data/external/`.
        #
        # Core leg only, and only on the shard the planner gave the anchor: the anchor
        # needs no `nn`, and one download a night is enough.
        #
        # NO actions/cache and NO artifact, on purpose. A cache entry written on `main` can
        # be restored by any branch's workflow, a fork PR's included, so caching the file
        # would hand the data to anyone who opens a PR. The download is ~10 MB and took
        # minutes when measured, so it is paid every night.
        #
        # `continue-on-error`: a Europe PMC outage must not cost the rest of the suite.
        # Every core shard sets FERX_REQUIRE_EXTERNAL_DATA=1, so a failed fetch still
        # turns the run red, through the anchor's own panic, which names the cause. The
        # 15-minute cap keeps a hung download inside the job ceiling.
        if: matrix.leg == 'core' && steps.plan.outputs.present == 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          python3 tools/mbma_canakinumab_fetch.py
          python3 tools/mbma_canakinumab_fetch.py --check

      - name: cargo test (ci-test profile + slow-tests)
        env:
          # A missing canakinumab file is a red test on the core leg, and a skip on
          # full-nn, which never fetches it (see the step above).
          FERX_REQUIRE_EXTERNAL_DATA: ${{ matrix.leg == 'core' && '1' || '' }}
        # `tools/ci-test-shard.py run slow` lists every binary of the shard (`--list`,
        # `--list --ignored`), runs them with plain `cargo test`, and writes
        # `manifest/manifest.tsv`, which `summary` holds the run against. The cargo
        # build arguments, after the first `--`:
        #
        # `--profile ci-test` (defined in Cargo.toml) keeps release-level
        # optimisation so the heavy fits run fast, but drops fat LTO — the
        # whole-program link tax that otherwise dominates this build.
        #
        # `--no-fail-fast` keeps cargo running every test binary even after one
        # fails. Without it, cargo aborts at the first failed binary and the
        # remaining integration-test binaries (alphabetically after the failing
        # one) silently never run, masking concurrent regressions.
        #
        # `survival` is included so the Phase 1 TTE Tier-3 tests
        # (`tests/tte_convergence.rs`, gated on BOTH `survival` and `slow-tests`)
        # actually execute here — the ci.yml `survival` job runs the TTE *smoke*
        # tests but not the slow convergence/SSE fits.
        #
        # `--workspace` with PACKAGE-QUALIFIED features (#1114): without
        # `--workspace` this builds the root `ferx-core` package only, so a
        # Tier-3 test in `crates/ferx-tools/tests/` stays `#[ignore]`d in every
        # job that exists and never runs anywhere. The features have to be
        # qualified because `ci`/`survival` are not features of the members and
        # `slow-tests` is declared by both `ferx-core` and `ferx-tools` — an
        # unqualified name would resolve to the root package's and leave the
        # member's gate closed.
        #
        # `--exclude docs-lint`: that crate is a structural linter over `docs/**` with its
        # own seconds-long CI job, and it depends on nothing. Running it here would put
        # `docs/**` among this job's inputs, so a docs typo would trigger the fit
        # suite — and it would couple the linter to the `ferx-core` compile path, which is
        # exactly what keeping it dependency-free was for (#969). The guard reads this
        # `--exclude` list, so adding or dropping one moves the path filter with it; and
        # the planner refuses build args whose `--exclude` disagrees with its suite's.
        #
        # `timeout` is what makes an overrun visible. A job killed by `timeout-minutes` is
        # reported by GitHub as **`cancelled`, not `failure`** -- it does not read as a red
        # test. Exceeding the inner budget exits 124 and fails the step loudly instead.
        run: |
          timeout --signal=INT --kill-after=2m ${{ matrix.leg == 'core' && '60m' || '95m' }} \
            python3 tools/ci-test-shard.py run slow ${{ matrix.shard }} ${{ strategy.job-total }} --lib-parts 1 --manifest manifest -- \
              --workspace --exclude docs-lint --no-default-features \
              --features ${{ matrix.leg == 'core' && 'ferx-core/ci,ferx-core/survival,ferx-core/slow-tests,ferx-tools/slow-tests' || 'ferx-core/ci,ferx-core/survival,ferx-core/nn,ferx-core/slow-tests,ferx-tools/slow-tests' }} \
              --profile ci-test --no-fail-fast ${{ inputs.nocapture && '-- --nocapture' || '' }} \
            || { code=$?; \
                 if [ "$code" -eq 124 ]; then \
                   echo "::error::slow-tests (${{ matrix.leg }} ${{ matrix.shard }}/${{ strategy.job-total }}) exceeded its inner budget - a test is hanging or the shard outgrew it; refresh the weights (tools/ci-test-shard.py weights slow LOG) or add a shard"; \
                 fi; \
                 exit "$code"; }

      - name: Upload the shard manifest
        # `always()`: a red or timed-out shard's partial manifest is what lets
        # `summary` say what it did and did not run.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slow-manifest-${{ matrix.leg }}-${{ matrix.shard }}
          path: manifest/
          if-no-files-found: warn
          retention-days: 7

  # The leg's one verdict over its four shards. `always()`, not `!cancelled()` and not
  # a bare `needs:`: either SKIPS this job when a shard fails or is cancelled, and a
  # job killed by `timeout-minutes` is `cancelled`, so a timed-out night would end
  # with no verdict at all. The shards' aggregate result goes to the check as
  # `--result`, so a non-success shard job is an error here even if it left a
  # manifest that looks complete.
  summary:
    name: Slow regression tests (${{ github.event.schedule == '0 7 * * 0' && 'full-nn' || inputs.leg || 'core' }})
    needs: shards
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: slow-manifest-${{ github.event.schedule == '0 7 * * 0' && 'full-nn' || inputs.leg || 'core' }}-*
          path: manifests
      - name: Every test target ran on exactly one shard, and every listed test ran
        run: python3 tools/ci-test-shard.py check slow 4 manifests --result ${{ needs.shards.result }} --budget-min ${{ (github.event.schedule == '0 7 * * 0' || inputs.leg == 'full-nn') && '95' || '60' }}

  # The lib unit tests plus the binaries in `tools/slow-nn-tests.txt`, with `nn` on.
  # Every other binary runs the same test set with and without `nn` (measured on
  # `ff594e7a`: 8 binaries differ, 6 gain tests, 2 only lose them), so the core shards
  # already run it, and the weekly `full-nn` leg covers nn-on behaviour in binaries
  # that hold no nn test. `--list-all` also lists every binary of the slow suite
  # under `nn`, for `nn-summary`'s check that the list is complete.
  #
  # Budget: a worst-case nn compile of 19 min (`fcad163d`) plus 1.81 x its ~15 fast
  # test-min (lib 674 s, the DCM VI fits 202 s) is 46 min. Measured on the #2182
  # dispatches: 35.9, 46.8 and 29.2 min, so the predicted worst case does occur;
  # 46.8 / 0.7 = 67, rounded up to 70.
  nn:
    name: Slow regression tests (nn)
    if: github.event.schedule != '0 7 * * 0' && inputs.leg != 'full-nn'
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - name: Drop the runner image's stable toolchain from the cache key (#2184)
        # See the same step on `shards`.
        run: |
          rustup default nightly
          rustup toolchain uninstall stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-slow-nn
          # See the same setting on `shards` (#2184).
          cache-on-failure: true
      - name: cargo test (ci-test profile + slow-tests + nn)
        # The build arguments of `shards`, plus `ferx-core/nn`.
        run: |
          timeout --signal=INT --kill-after=2m 70m \
            python3 tools/ci-test-shard.py run slow-nn 1 1 --lib-parts 1 --list-all --manifest manifest -- \
              --workspace --exclude docs-lint --no-default-features \
              --features ferx-core/ci,ferx-core/survival,ferx-core/nn,ferx-core/slow-tests,ferx-tools/slow-tests \
              --profile ci-test --no-fail-fast ${{ inputs.nocapture && '-- --nocapture' || '' }} \
            || { code=$?; \
                 if [ "$code" -eq 124 ]; then \
                   echo "::error::slow-tests (nn) exceeded its 70m budget - a test is hanging or the nn list outgrew it"; \
                 fi; \
                 exit "$code"; }
      - name: Upload the nn manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slow-manifest-nn
          path: manifest/
          if-no-files-found: warn
          retention-days: 7

  # The nn job's own verdict (as `summary`), then the list check: the binaries that
  # gain a runnable test under `nn`, read from the two builds' `--list` and not from
  # the source, must be exactly `tools/slow-nn-tests.txt`. It reads the core shards'
  # manifests too, hence `needs: [shards, nn]`; `always()` for the reason on `summary`.
  nn-summary:
    name: Slow regression tests (nn test set)
    needs: [shards, nn]
    if: always() && github.event.schedule != '0 7 * * 0' && inputs.leg != 'full-nn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: slow-manifest-core-*
          path: core-manifests
      - uses: actions/download-artifact@v8
        # A missing manifest is the check's to name ("no nn --list-all manifest"),
        # not a download error that skips it.
        continue-on-error: true
        with:
          name: slow-manifest-nn
          path: nn-manifest
      - name: The nn job ran every listed test
        run: python3 tools/ci-test-shard.py check slow-nn 1 nn-manifest --result ${{ needs.nn.result }} --budget-min 70
      - name: tools/slow-nn-tests.txt is every binary nn adds a test to
        # Not skipped by a red step above: the two verdicts are independent.
        if: success() || failure()
        run: python3 tools/ci-test-shard.py check-nn core-manifests nn-manifest
