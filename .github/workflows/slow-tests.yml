name: Slow tests

# Heavy fit-based regression tests (each runs a real FOCEI / GN-hybrid / EKF
# population fit) that take 5–60 min on a 2-core ubuntu-latest runner. The
# main CI workflow `#[ignore]`s them via `#[cfg_attr(not(feature = "slow-tests"), ignore)]`.
# This workflow runs them on a schedule + on-demand so they can't block
# pull-request merges but still get exercised regularly against `main`.

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch:       # manual trigger
  push:
    branches: [main]
    paths:
      # Re-run when a push to `main` touches either the code the heavy fits
      # exercise or the inputs that decide what they run and what they are
      # compared against.
      #
      # Directories are matched with `**` rather than enumerated file-by-file.
      # A named file that later moves, splits, or is renamed leaves behind a
      # glob that matches nothing, and a stale glob is indistinguishable from a
      # correct one in review — that is exactly how `src/api.rs` stopped firing
      # this leg after the `src/api/` split, silently, for months (#949).
      # `.github/workflows/ci.yml` has a `Slow-test path filter` job that fails
      # if an entry here matches nothing, or if a new top-level `src/` module
      # appears that is neither listed here nor on that job's explicit
      # "cannot move a fit" allowlist.
      - 'Cargo.toml'            # `ci-test` profile + the `slow-tests` / `survival` features
      - 'data/**'               # fixture CSVs the NONMEM-anchored fits read by literal path
      - 'src/api/**'
      - 'src/dosing.rs'         # dose resolution + SS equilibration, shared by pk/ode/sens
      - 'src/estimation/**'
      - 'src/frem/**'           # tests/frem_warfarin.rs
      - 'src/io/**'             # the dataset reader every fit is fed from
      - 'src/markov/**'         # tests/markov_nonmem.rs
      - 'src/nn/**'             # tests/nn_fit_convergence.rs
      - 'src/ode/**'            # integrator + every stepper (rk45, vern7, rosenbrock/rodas)
                                # and the EKF, which reaches `solve_ode` from `src/ode/solver.rs`
      - 'src/parser/**'         # compiles every model the heavy fits run, so a change to model
                                # compilation (e.g. the structural-param binding in #261) can
                                # shift a fit's objective or break it outright — including the
                                # NONMEM anchor in tests/structural_param_nonmem.rs
      - 'src/pk/**'             # the analytic closed forms the analytical anchors integrate
      - 'src/sens/**'           # exact ∂f/∂η, ∂f/∂θ that every FOCE/FOCEI heavy fit consumes,
                                # so a sens-only change can shift a fit's objective or its
                                # convergence path without touching estimation/ at all
      - 'src/sim/**'            # adaptive-dosing drivers (#391) behind the mrgsolve anchors
      - 'src/stats/**'          # likelihood + residual_error (dense R, IWRES/CWRES, sigma)
      - 'src/suggest_start/**'  # tests/suggest_start_comparison.rs
      - 'src/survival/**'       # hazard closed forms behind the `survival`-gated TTE fits
      - 'src/types.rs'          # CompiledModel / Population / FitOptions, shared by every fit
      - 'tests/**'              # the gated fits themselves + the shared tests/common harness

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: nightly
  RAYON_NUM_THREADS: 1

jobs:
  slow-tests:
    name: Slow regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-slow
      - name: cargo test (ci-test profile + slow-tests)
        # `--profile ci-test` (defined in Cargo.toml) keeps release-level
        # optimisation so the heavy fits run fast, but drops fat LTO — the
        # whole-program link tax that otherwise dominates this build.
        #
        # `--lib` is intentionally omitted so integration tests in `tests/`
        # are compiled and run here. Gated slow tests (the `slow-tests` feature
        # removes their `#[ignore]`) and ungated integration tests both execute.
        #
        # `--no-fail-fast` keeps cargo running every test binary even after one
        # fails. Without it, cargo aborts at the first failed binary and the
        # remaining ~15 integration-test binaries (alphabetically after the
        # failing one) silently never run, masking concurrent regressions.
        #
        # `survival` is included so the Phase 1 TTE Tier-3 tests
        # (`tests/tte_convergence.rs`, gated on BOTH `survival` and `slow-tests`)
        # actually execute here — the ci.yml `survival` job runs the TTE *smoke*
        # tests but not the slow convergence/SSE fits.
        run: cargo test --no-default-features --features ci,survival,slow-tests --profile ci-test --no-fail-fast
