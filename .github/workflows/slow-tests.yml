name: Slow tests

# Heavy fit-based regression tests (each runs a real FOCEI / GN-hybrid / EKF
# population fit) that take 5–60 min on a 2-core ubuntu-latest runner. The
# main CI workflow `#[ignore]`s them via `#[cfg_attr(not(feature = "slow-tests"), ignore)]`.
# This workflow runs them on a schedule + on-demand so they can't block
# pull-request merges but still get exercised regularly against `main`.

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch:       # manual trigger
  push:
    branches: [main]
    paths:
      # One rule, no per-module judgement: re-run when a push to `main` touches the code
      # compiled into this job's test binaries, the data those tests read, or the
      # definition of the job itself.
      #
      # It is deliberately NOT a curated list of "modules that can move a fit". That list
      # existed and it rotted: `src/api.rs` was named here, the file became `src/api/`, and
      # the glob went dead — silently, for months, because a stale glob and a live one look
      # identical in review (#949). Enumerating by module also makes every new module a
      # silent omission until someone remembers; that is how `src/pk`, `src/survival`,
      # `examples/` and `nonmem_anchor/` all ended up uncovered.
      #
      # Measured over the last 400 first-parent commits on `main`: the original 7-entry
      # filter fired on 292, a per-module list on 359, and this one on 363. So curating
      # bought 4 skipped runs in 400 (1% — one of them a `Cargo.lock` bump that should run
      # anyway) while silently missing 67. That is the trade, and it is not close.
      #
      # `tests/slow_test_path_filter.rs` pins this list in both directions: every input the
      # suite reads must be matched here, and every entry here must match a tracked file.
      # The input roots it checks against are derived from the tree and from the fixture
      # paths the tests themselves open — so a new module or fixture directory fails that
      # test until it is added below, rather than going quietly uncovered.
      - '.github/workflows/slow-tests.yml'  # the feature set / cargo command this job runs
      - 'Cargo.lock'                        # a nlopt/nalgebra/rand bump moves fit numbers and RNG streams
      - 'Cargo.toml'                        # the `ci-test` profile + the `slow-tests` / `survival` features
      - 'data/**'                           # fixture CSVs the fits read by literal path
      - 'examples/**'                       # `.ferx` models the anchors load (e.g. the adaptive vanco suite)
      - 'nonmem_anchor/**'                  # committed NONMEM control streams, data and `.phi` references
      - 'src/**'                            # everything linked into the fits
      - 'tests/**'                          # the gated fits themselves + the shared tests/common harness

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: nightly
  RAYON_NUM_THREADS: 1

jobs:
  slow-tests:
    name: Slow regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-slow
      - name: cargo test (ci-test profile + slow-tests)
        # `--profile ci-test` (defined in Cargo.toml) keeps release-level
        # optimisation so the heavy fits run fast, but drops fat LTO — the
        # whole-program link tax that otherwise dominates this build.
        #
        # `--lib` is intentionally omitted so integration tests in `tests/`
        # are compiled and run here. Gated slow tests (the `slow-tests` feature
        # removes their `#[ignore]`) and ungated integration tests both execute.
        #
        # `--no-fail-fast` keeps cargo running every test binary even after one
        # fails. Without it, cargo aborts at the first failed binary and the
        # remaining ~15 integration-test binaries (alphabetically after the
        # failing one) silently never run, masking concurrent regressions.
        #
        # `survival` is included so the Phase 1 TTE Tier-3 tests
        # (`tests/tte_convergence.rs`, gated on BOTH `survival` and `slow-tests`)
        # actually execute here — the ci.yml `survival` job runs the TTE *smoke*
        # tests but not the slow convergence/SSE fits.
        run: cargo test --no-default-features --features ci,survival,slow-tests --profile ci-test --no-fail-fast
