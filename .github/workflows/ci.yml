name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'  # Mondays 03:00 UTC — coverage job

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: nightly
  # ferx_core's hot paths (`obs_nll_sum`, `foce_population_nll`, EKF/SDE)
  # use rayon::par_iter over subjects. cargo test already parallelises tests
  # across cores, so unconstrained rayon causes N×N thread oversubscription
  # on a 2-core ubuntu-latest runner. Pinning rayon to 1 thread lets cargo
  # own the parallelism. (Local machines stay fast because cores ≫ tests.)
  RAYON_NUM_THREADS: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - name: cargo check
        run: cargo check --tests --no-default-features --features ci

      # `tests/tte_convergence.rs` is gated on BOTH `survival` and `slow-tests`, and
      # no other per-PR job sets both — so those Tier-3 TTE tests are compiled in
      # *neither*. Without this step a renamed public API or changed `FitResult`
      # field would land green and only break the nightly slow-tests run, decoupled
      # from the offending PR. Compile-only (`cargo check`, no run — the tests
      # themselves stay nightly per the tier rules), so it is cheap.
      # (#441 review finding #3.)
      - name: cargo check (survival + slow-tests gated tests)
        run: cargo check --tests --no-default-features --features ci,survival,slow-tests

      # This step is also what COMPILE-GATES the whole feature-gated surface. The
      # `Tests + coverage (TTE/CTMM endpoints)` job below deliberately builds only
      # the handful of endpoint test binaries, so a break in any *other* test file
      # under `--features ci,markov` (which implies `survival`) is caught here, in
      # ~1 min, instead of by an 18-min instrumented build.
      - name: cargo check (markov-gated module + tests)
        run: cargo check --tests --no-default-features --features ci,markov

      # Same rationale for `nn`, with `slow-tests` folded in for the same reason as
      # the survival step above: `tests/nn_fit_smoke.rs` and
      # `tests/nn_fit_convergence.rs` are gated on BOTH `nn` and `slow-tests`, so
      # their bodies compile in no other per-PR job. One cheap `cargo check`
      # compile-gates the whole `nn` surface — `src/nn`, the `[covariate_nn]`
      # parser, the θ-gradient module, and every nn-gated test file — so a broken
      # signature surfaces here in ~1 min rather than in the instrumented
      # coverage job (or, worse, only in the nightly slow-tests run).
      - name: cargo check (nn-gated module + tests)
        run: cargo check --tests --no-default-features --features ci,nn,slow-tests

  # Every default-off feature surface the `ci` build compiles out: the non-Gaussian
  # endpoint families (TTE/survival + categorical + CTMM) and the covariate-NN /
  # DCM stack (`nn`). This ONE job replaces the former separate `Survival (TTE)`
  # and `Markov (CTMM)` jobs: `markov = ["survival"]` in Cargo.toml, so a
  # `--features ci,markov` build is a strict superset of a `--features ci,survival`
  # one — the old survival job compiled and ran nothing the markov job did not, and
  # its lcov was a subset. All three Codecov flags are uploaded from this single
  # report (codecov.yml still names `survival`, `markov` and `nn` separately in its
  # patch/project statuses).
  #
  # `nn` rides along here rather than in a job of its own for a reason that is not
  # just CI minutes: `tests/tte_smoke.rs` holds an nn-gated test
  # (`event_model_referencing_nn_driven_indiv_param_is_rejected`, #442) inside a
  # `#![cfg(feature = "survival")]` file, so it compiles only when `survival` AND
  # `nn` are both on. A standalone `--features ci,nn` job could never measure it,
  # and the set-equality guard below would have to grow an exemption rule to stay
  # satisfiable. One combined feature set keeps that guard a plain set equality.
  #
  # NOTE: the job's display `name` is deliberately unchanged despite the widened
  # scope — it is the string branch protection matches on.
  endpoints:
    name: Tests + coverage (TTE/CTMM endpoints)
    runs-on: ubuntu-latest
    # Override the global nightly: the crate has no nightly-only code, so this
    # job builds fine on stable. Stable's rustc version holds for ~6 weeks vs
    # nightly's daily bump, so the instrumented cache (keyed on rustc version)
    # stays warm instead of cold-rebuilding the whole dep graph under coverage
    # RUSTFLAGS every run.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal -c llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          # Instrumented build (coverage RUSTFLAGS) can't share the plain `ci`
          # caches; own key, like the other coverage job (`coverage-pr` -> ci-cov).
          shared-key: ci-cov-endpoints
      - name: Install cargo-llvm-cov
        # Prebuilt binary (no compile) so this job stays fast.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # All TTE/categorical/CTMM code is behind `#[cfg(feature = "survival")]` or
      # `#[cfg(feature = "markov")]`, and all covariate-NN / DCM code behind
      # `#[cfg(feature = "nn")]`, so neither the default `ci` jobs nor the
      # `fast`/`slow` coverage jobs compile any of it — Codecov would report those
      # lines as missed even though they are exercised, and a survival-, markov- or
      # nn-only PR would fail its own patch gate at 0% (#293). This job MEASURES
      # that surface and uploads it under all three flags, which Codecov merges
      # with `fast`/`slow` by summing hits.
      #
      # Explicit `--test` list instead of `--tests`: the base suite's 122
      # integration binaries are already run — and already measured — by
      # `Tests + coverage (core)`, so re-running them here under a second feature
      # set bought no coverage (Codecov merges flags by summing hits) and cost
      # ~15 min of instrumented compile.
      #
      # The list is EXACTLY the set of `tests/*.rs` that mention a `survival`,
      # `markov` or `nn` cfg, and `tests/ci_workflow_endpoint_coverage.rs` asserts
      # that equality — so adding a test file that uses any of those features
      # without adding it here fails CI instead of silently reading as uncovered.
      # The Tier-3 files (`tte_convergence`, `categorical_convergence`,
      # `nn_fit_smoke`, `nn_fit_convergence`) are in the list on purpose: without
      # `slow-tests` their tests stay `#[ignore]`d, so they cost one cheap compile
      # each and keep the invariant a plain set equality with no exemption rule to
      # get wrong.
      #
      # `--lib` stays because the unit tests for `src/survival`, `src/markov`,
      # `src/nn`, `src/estimation/nn_theta_gradient` and the feature-gated branches
      # of the shared modules (parser, sens provider, io/output) live there — for
      # `nn` that is the bulk of the surface.
      - name: Generate TTE/CTMM endpoint coverage report
        run: |
          cargo llvm-cov --no-fail-fast --no-default-features --features ci,markov,nn --profile ci-fast \
            --lib \
            --test agq \
            --test categorical_convergence \
            --test categorical_smoke \
            --test dose_compartment_routing \
            --test markov_nonmem \
            --test markov_smoke \
            --test nn_dcm_smoke \
            --test nn_fit_convergence \
            --test nn_fit_smoke \
            --test tte_convergence \
            --test tte_smoke \
            --test vi_dcm_omega_recovery \
            --test zero_omega_fit \
            --lcov --output-path lcov.info

      - name: Upload to Codecov (survival + markov + nn flags)
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          flags: survival,markov,nn
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal -c clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - name: cargo clippy
        # Include `markov` and `nn` so the CTMM module and the covariate-NN / DCM
        # stack are linted too (both are compiled out of the base `ci` build).
        # `markov = ["survival"]`, so this lints the whole non-Gaussian endpoint
        # surface as well.
        run: cargo clippy --no-default-features --features ci,markov,nn

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal -c rustfmt

      - name: cargo fmt
        run: cargo fmt -- --check

  coverage:
    name: Tests + coverage (full, slow-tests)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Stable, not nightly: `--features ci,slow-tests` has no nightly-only code.
    # Keeps the instrumented `ci-slow` cache warm. See the endpoints job.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal -c llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-slow
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Generate coverage report
        # `slow-tests` un-ignores the gated tests, so `--include-ignored`
        # isn't needed; left off so a stray plain `#[ignore]` test elsewhere
        # in the suite doesn't silently inflate coverage measurements here.
        #
        # `--tests` (i.e. NOT `--lib`) so the integration tests in `tests/`
        # contribute to coverage — they exercise public-API entry points
        # (e.g. `inits_from_nca`, the full sweep paths in
        # `src/suggest_start/sweep.rs`) that no inline `#[cfg(test)]` test
        # reaches. Lib-only coverage misrepresented sweep.rs as ~8% covered
        # when its public functions were in fact extensively exercised.
        #
        # `--no-fail-fast` so a single test-binary failure doesn't abort
        # cargo's run and silently drop coverage from every later binary
        # (mirrors the same flag in slow-tests.yml).
        run: cargo llvm-cov --tests --no-fail-fast --no-default-features --features ci,slow-tests --profile ci-test --lcov --output-path lcov.info

      - name: Upload to Codecov (slow flag)
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          flags: slow
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  # The per-PR run of the base (`--features ci`) test suite AND the patch-coverage
  # gate — one instrumented build serving both. It used to be paired with a
  # separate uninstrumented `Test` job (`cargo test --lib` + two explicit
  # `--test`s on nightly); that job was a strict subset of this one — same
  # features, and `--tests` ⊇ `--lib` plus both of those integration files — so it
  # was removed rather than kept paying an 11-min lib compile twice over. The
  # nightly toolchain is still exercised per-PR by `Check`, `Clippy` and `Format`.
  coverage-pr:
    name: Tests + coverage (core)
    runs-on: ubuntu-latest
    # PRs *and* pushes to `main`. The `push` half matters: the removed `Test` job
    # had no `if:` and so ran on main pushes, and this is now the only job that
    # executes the base suite — without `push` a merge commit would run no tests
    # at all. (It also keeps the `fast` flag fresh on `main`, which
    # `carryforward: false` in codecov.yml otherwise leaves empty there.)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: write # for the below-floor nudge comment
    # Stable, not nightly: `--features ci` has no nightly-only code.
    # Keeps the instrumented `ci-cov` cache warm across runs
    # (stable rustc bumps ~6-weekly vs nightly daily). See the endpoints job.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal -c llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          # Own cache key: the instrumented build can't share artifacts with the
          # normal `ci` cache (different RUSTFLAGS).
          shared-key: ci-cov
      - name: Install cargo-llvm-cov
        # Prebuilt binary (no compile) so the per-PR job stays fast.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate fast coverage report
        # Fast tier only: `--features ci` (no `slow-tests`, no `survival`). This
        # both RUNS the base suite and is the per-PR patch gate; the full
        # `ci,slow-tests` run is nightly (the `coverage` job above) and the
        # feature-gated endpoints are the `endpoints` job. Builds with
        # `--profile ci-fast` (no fat LTO *and* no local ThinLTO — ~31% off the
        # lib compile, #969) to stay within the PR wall-clock; the fast Tier-1/2
        # fits here tolerate the ThinLTO-off fit slowdown that the nightly
        # `coverage`/`slow-tests` jobs avoid by staying on `ci-test`. `--tests`
        # so the integration tests both run and count (same rationale as nightly).
        run: cargo llvm-cov --tests --no-fail-fast --no-default-features --features ci --profile ci-fast --lcov --output-path lcov.info

      - name: Upload to Codecov (fast flag)
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          flags: fast
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Nudge the author while the project is below the floor
        # Informational, non-blocking. If the project (full, slow-inclusive)
        # coverage on `main` is below the 90% floor the weekly run enforces,
        # post/update ONE sticky PR comment so the author is nudged to cover new
        # lines. Self-resolves once the backfill clears 90%. Never fails the PR
        # (continue-on-error); skipped on forks (read-only token) and on the
        # `push` half of this job's trigger, where there is no PR to comment on.
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          marker='<!-- coverage-floor-nudge -->'
          cov=$(curl -s --max-time 20 \
            "https://codecov.io/api/v2/github/FeRx-NLME/repos/ferx-core/totals/" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['totals']['coverage'])" 2>/dev/null || true)
          if [ -z "${cov:-}" ]; then echo "no coverage figure; skipping nudge"; exit 0; fi
          below=$(python3 -c "import sys; print('1' if float(sys.argv[1]) < 90 else '0')" "$cov")
          # `// empty` so a no-match yields an empty string (-> POST a new
          # comment) instead of the literal `null`; `--paginate` so the marker
          # isn't missed past the first page of comments.
          existing=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq "[.[] | select(.body | contains(\"$marker\"))][0].id // empty" 2>/dev/null || true)
          if [ "$below" = "1" ]; then
            body=$(printf '%s\n📉 **Coverage floor not yet met.** Project coverage is **%s%%**, below the **90%%** floor enforced on the weekly full-coverage run (see #286).\n\nThis PR is **not blocked**. If it adds code, please make sure the new lines are covered — the `patch` check (target 90%%) grades exactly your changed lines, and the Codecov report below shows the gaps. Thanks for helping clear the floor. 🙏' "$marker" "$cov")
          else
            body=$(printf '%s\n✅ Project coverage is at or above the 90%% floor — thanks for keeping it green!' "$marker")
          fi
          if [ -n "${existing:-}" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" >/dev/null
          elif [ "$below" = "1" ]; then
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
          fi
