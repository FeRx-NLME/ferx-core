# The repo root is BOTH the `ferx-core` package and the workspace root. That is
# deliberate and load-bearing: `ferx-r/src/rust/.cargo/config.toml` patches
# `ferx-core = { path = "../../../ferx-core" }` — the repo root — so moving the
# package under `crates/` would break every local ferx-r build, and break it
# *silently* (the patch stops applying and ferx-r quietly builds `main` instead
# of your branch). See #1114.
#
# Boundary rule: `ferx-core` = one model, one dataset, one fit. `ferx-tools` =
# many fits, resampling, model-space search. Statistical kernels stay in core;
# orchestration of repeated fits lives in tools. `ferx-core` never depends on
# either member (A1); the public-API baseline in `api/ferx-core-public-api.txt`
# is what keeps the boundary honest (A2).
[workspace]
# `crates/docs-lint` is dev tooling, not part of the boundary above: it is a
# member so it gets rustfmt / clippy / `cargo test`, it depends on nothing (not
# even `ferx-core`), and nothing depends on it. See #1163.
members = ["crates/ferx-tools", "crates/ferx-cli", "crates/docs-lint"]
# Required to PRESERVE existing behaviour, not to change it: a standalone
# edition-2021 package gets resolver v2 implicitly, but inside a workspace the
# root package's edition no longer implies it — cargo would warn and fall back
# to v1, quietly changing how dev-/build-dependency features unify into the
# `ferx-core` build. Naming v2 keeps `ferx-core` resolving exactly as it did
# before the split.
resolver = "2"

[package]
name = "ferx-core"
version = "0.3.1"
edition = "2021"
description = "Nonlinear Mixed Effects modeling engine with FOCE/FOCEI estimation"
license = "MIT"
authors = ["Ron Keizer", "Teun Post", "Hidde van de Beek"]
repository = "https://github.com/FeRx-NLME/ferx-core"
keywords = ["nlme", "pharmacometrics", "pharmacokinetics", "foce", "ode"]
categories = ["science", "mathematics", "simulation"]
readme = "README.md"
# `data/mbma_naproxen.csv` is CC BY-NC 4.0, not MIT (see the root LICENSE and
# data/mbma_naproxen.LICENSE). It is a slow-test fixture, so excluding it keeps
# the crate published to crates.io free of any CC BY-NC file. The glob also takes
# its README and licence companions, which are MIT / Creative Commons' own text
# respectively — they are dropped because they are meaningless without the data,
# not because of their licence. The slow test that reads the fixture is covered
# by the blanket `tests/*` exclusion below.
#
# The glob deliberately has no `.` after `mbma_naproxen`: `data/mbma_naproxen.*`
# matched the csv/LICENSE/README but not `data/mbma_naproxen_source.py` (#1170).
# `examples/mbma_naproxen.ferx` is listed separately for the same reason the
# slow test is: without the excluded csv it is an example that cannot run.
#
# `api/` is the CI-enforced public-API baseline (#1114) — a 388 KB rustdoc-derived
# snapshot that is repo infrastructure, not crate content, so it is kept out of
# the published tarball too.
exclude = [
  "data/mbma_naproxen*",
  "examples/mbma_naproxen.ferx",
  "api/*",
  # Repo infrastructure, not crate content. None of it is needed to build or
  # document the crate, and together it is roughly 7.5 MB of a 19.6 MB tarball.
  # `nonmem_anchor/` goes with `tests/`: it is the NONMEM reference output the
  # anchor tests read, and nothing outside `tests/` opens it (the mentions in
  # `src/` are prose in doc comments). Consumers who want to run the test suite
  # clone the repo; the published crate exists to be built against.
  "tests/*",
  "nonmem_anchor/*",
  "docs/*",
  "plans/*",
  "tools/*",
  ".github/*",
  ".githooks/*",
  "AGENTS.md",
  "CLAUDE.md",
  "SDLC.md",
  "VI_VALIDATION.md",
  "codecov.yml",
]

[features]
default = []
# The Enzyme autodiff sensitivity path was retired in favour of the hand-rolled
# `Dual2` analytic sensitivities (`sens/`) for FOCE/FOCEI; `ci` remains as a no-op
# so existing `--features ci` invocations keep working.
ci = []
# Opt-in support for neural-network-based covariate models (DCM) and
# dynamics (low-dim NODE). See `plans/dcm-and-low-dim-node.md`. No new
# runtime deps — the MLP runs on top of `nalgebra`.
nn = []
# TTE/survival/categorical non-Gaussian endpoint support.
# Default-off while Phase 1 is in development; promoted to default-on after
# nlmixr2/NONMEM validation (see plans/tte-survival-markov.md Phase 1).
survival = []
# Continuous-time Markov models (CTMM). Matrix-exponential transition
# probabilities + exact Van Loan gradients on top of nalgebra's `expm`; no new
# runtime deps. Default-off while maturing; promote after CAV-dataset / `msm`
# validation (see plans/tte-survival-markov.md §8.7, D5).
#
# Implies `survival`: the CTMM endpoint (`EndpointLikelihood::Ctmm`) plugs into
# the shared non-Gaussian endpoint machinery (the `EndpointLikelihood` enum,
# per-CMT dispatch, discrete-state datareader routing), which lives behind the
# `survival` gate (D8). Turning on `markov` therefore turns on that trunk.
markov = ["survival"]
# Heavy fit-based tests (5–60 min wall each on a 2-core CI runner).
# Default `cargo test` `#[ignore]`s them; a nightly/manual job opts in.
slow-tests = []

[dependencies]
nalgebra = "0.35"
csv = "1.3"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: without it `serde_json` parses floats to within 1 ULP
# rather than exactly, so a `.fitrx` bundle — or any JSON a checkpoint or cache
# reads back — can return an estimate one bit from the one that was written.
# Every consumer here is numeric output that is meant to reload as itself.
serde_json = { version = "1", features = ["float_roundtrip"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
rayon = "1.10"
rand = "0.10"
rand_distr = "0.6"
regex = "1.11"
thiserror = "2"
nlopt = "0.8"
argmin = { version = "0.11", features = ["serde1"] }
argmin-math = { version = "0.5", features = ["vec"] }
tempfile = "3"
sha2 = "0.11"
sobol = "1.0"

[dev-dependencies]
approx = "0.5"

[profile.release]
lto = "fat"

# Used by the CI test/coverage jobs: release-level optimisation (so the
# population-fit tests stay fast) but NO fat LTO, whose whole-program link
# dominated the Test/Survival/coverage jobs (the ~8 min Survival job was ~96%
# LTO compile, ~20 s of actual tests). The shipped `release` keeps `lto = "fat"`.
[profile.ci-test]
inherits = "release"
lto = false

# Used by the per-PR `ci.yml` jobs only. `ci-test` sets `lto = false`, which in
# Cargo means "no *cross-crate* LTO" but still leaves rustc's *local* ThinLTO
# across the crate's codegen units on — and that local ThinLTO is ~77% of the
# lib's LLVM time (measured 2026-08-15, #969/#971). `lto = "off"` disables it,
# cutting the lib compile ~31% (~404s → ~277s locally). The trade is that the
# population fits run ~20–40% slower without it — which is why this profile is
# for the per-PR jobs (compile-bound, fits are fast Tier-1/2) and NOT for the
# heavy Tier-3 fits: `slow-tests.yml` and the nightly full-coverage job stay on
# `ci-test` so their 5–60 min fits keep the ThinLTO speedup. See #969.
[profile.ci-fast]
inherits = "ci-test"
lto = "off"
