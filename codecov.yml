# Coverage policy for ferx-core. Rule: CLAUDE.md. Work: #286. Discussion: #285.
#
# Sustainability model: coverage is enforced where it's fair, informational
# where it isn't.
#   patch                -> every PR's own changed lines must be tested (ENFORCED)
#   project/default      -> per-PR no-regression context (informational, non-blocking)
#   project/floor        -> per-PR 90% gap shown to the author (informational)
#   project/floor_weekly -> 90% floor ENFORCED on the weekly main run (goes red
#                           below 90%); never evaluated on PRs, so it blocks no one
# Slow-tests NEVER run on PRs. Per-PR uploads = `fast` (--features ci, from
# `Tests + coverage (core)`) + `survival`, `markov` AND `nn`, which are ALL uploaded
# from the single `Tests + coverage (TTE/CTMM endpoints)` job (--features
# ci,markov,nn, and `markov = ["survival"]` so that build is a strict superset of a
# survival-only one); nightly upload = `slow` flag (--features ci,slow-tests).
# carryforward lets the nightly `slow` data augment the project number on PRs without
# re-running it. The `survival`, `markov` and `nn` flags exist because that
# feature-gated code is compiled OUT of the `fast`/`slow` FD builds — Codecov merges
# the flags in so those lines are counted where they're actually exercised (#293).
# All three flags are kept as distinct names (rather than collapsed into one) so the
# patch status can require each family independently and so a future split of the
# jobs needs no config change.

coverage:
  range: 85..95
  precision: 2
  round: down
  status:
    project:
      # Per-PR project statuses are INFORMATIONAL: they never block a
      # contributor and never show a red X on a PR. (They also read low on a
      # PR until carryforward is seeded, since the per-PR job is fast-only —
      # another reason not to gate on them.) The teeth live on `patch` (per
      # PR) and `floor_weekly` (the weekly main run).
      #
      # No-regression context, relative to base.
      default:
        target: auto
        threshold: 0.5%
        informational: true
        flags:
          - fast
          - slow
          - survival
          - markov
          - nn
      # The explicit 90% gap, shown on every PR so the author sees how far
      # under the floor they are — informational, so it challenges without
      # gatekeeping.
      floor:
        target: 90%
        threshold: 0%
        informational: true
        flags:
          - fast
          - slow
          - survival
          - markov
          - nn
      # The teeth: ENFORCED on the weekly full-coverage run on `main` only, so
      # the project status genuinely goes RED there while we're below 90%.
      # Never evaluated on PRs (branches: main), so it blocks no one. No later
      # flip needed — it's enforcing now and turns green on its own once the
      # backfill clears 90%.
      floor_weekly:
        target: 90%
        threshold: 0%
        informational: false
        branches:
          - main
        flags:
          - fast
          - slow
          - survival
          - markov
          - nn
    patch:
      default:
        target: 90% # new/changed lines must be tested
        threshold: 0%
        # Patch is a pull-request concept — grade changed lines only on PRs.
        # It previously mis-graded merge commits on `main` (a false red that
        # blocks nothing); `only_pulls` confines the status to PR comparisons.
        # (#300)
        only_pulls: true
        # `fast`, `survival`, `markov`, and `nn` are the FRESH per-PR coverage
        # sources, so they grade the changed lines. `survival`, `markov` and `nn`
        # are each required here: their feature-gated code is compiled out of the
        # `fast` build, so without the flag a survival-, markov- or nn-only PR's own
        # new lines would read as uncovered and fail this gate at 0%. `slow` stays
        # excluded — it's carryforward (stale for brand-new code).
        flags:
          - fast
          - survival
          - markov
          - nn

flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: fast
      carryforward: false
    - name: slow
      carryforward: true
    - name: survival
      # `Tests + coverage (TTE/CTMM endpoints)` runs on PRs, main pushes, AND the
      # weekly schedule, so this flag normally uploads fresh. carryforward is a
      # safety net: it still contributes on any run where that job didn't upload
      # (fresh data overrides).
      carryforward: true
    - name: markov
      # Same job, same upload, same rationale as `survival` above.
      carryforward: true
    - name: nn
      # Same job, same upload, same rationale as `survival` above. Covers the
      # `[covariate_nn]` / DCM surface (`src/nn`, the θ-gradient module, and the
      # `nn`-gated branches of the parser, sens provider and io/output), which is
      # compiled out of every non-`nn` build.
      carryforward: true

comment:
  layout: "header, diff, flags, files"
  require_changes: true

# Ignore policy: scope by what the code IS, never by how red it is.
#   tests/**, build.rs        -> don't measure coverage OF test/build code.
#   src/bin/generate_data.rs  -> maintainer tool that writes example-data
#       fixtures; not library, not the user-facing CLI. Guarded at the right
#       altitude by the e2e smoke test in tests/cli_binaries.rs. Ignorable on
#       its role (would be even at 100%), not to pad the number.
#
# Deliberately NOT ignored:
#   src/bin/run_model.rs      -> the `ferx` CLI (arg parsing, dispatch, error
#       exits) is user-facing logic -> refactored into a lib run() and
#       unit-tested, not excluded (#286).
#
ignore:
  - "tests/**"
  - "**/build.rs"
  - "src/bin/generate_data.rs"
  - "src/bin/pktte_sim_anchor.rs"
  - "src/bin/rtte_sim_anchor.rs"
